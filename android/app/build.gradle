apply plugin: 'com.android.application'

android {
    namespace 'com.leadybag.app'
    compileSdkVersion 33
    
    defaultConfig {
        applicationId "com.leadybag.app"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ربط ملفات نظام أندرويد الأساسية مباشرة لتجاوز خطأ عدم العثور على ViewGroup
    compileOnly files('C:/Users/sabpiy/AppData/Local/Android/Sdk/platforms/android-33/android.jar')

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.activity:activity:1.7.2"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.webkit:webkit:1.7.0"
    implementation "androidx.fragment:fragment:1.5.7"

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation project(':capacitor-cordova-android-plugins')
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.9.0'
        force 'androidx.core:core-ktx:1.9.0'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
        force 'androidx.fragment:fragment:1.5.7'
        force 'androidx.activity:activity:1.7.2'
        force 'androidx.webkit:webkit:1.7.0'
        
        // توحيد إصدارات كوتلن لمنع تكرار الملفات
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    }
}